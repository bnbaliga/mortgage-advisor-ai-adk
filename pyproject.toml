[project]
name = "mortgage-advisor-ai-adk"
version = "0.2.0"
description = "Mac — AI Mortgage Advisor: a real-time voice agent for mortgage origination and servicing, built on Google ADK and the Gemini Live API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "google-genai>=1.20",
    "python-dotenv>=1.0",
    "websockets>=13",
    "google-adk>=2.2",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "trafilatura>=2.3.1",
    "beautifulsoup4>=4.15.0",
    "pypdf>=7.0.1",
    "numpy>=2.4.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend/mortgage_advisor"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src/backend"]
testpaths = ["tests"]
